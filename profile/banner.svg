<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060a"/>
      <stop offset="55%" stop-color="#0b0f1a"/>
      <stop offset="100%" stop-color="#0a0d16"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2fe6ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2fe6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfe9ff"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2fe6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2fe6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <circle cx="230" cy="120" r="260" fill="url(#glowPurple)"/>
  <circle cx="1080" cy="260" r="280" fill="url(#glowCyan)"/>
  <rect x="0" y="0" width="1280" height="2" fill="url(#lineGrad)"/>
  <rect x="0" y="358" width="1280" height="2" fill="url(#lineGrad)"/>
  <g transform="translate(80,64)">
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.28"/>
    <circle cx="20" cy="17" r="4" fill="#2fe6ff"/>
    <text x="34" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#2fe6ff">AI FINANCIAL AGENT</text>
  </g>
  <text x="80" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" fill="url(#titleGrad)">Fiiuno</text>
  <text x="82" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#9fb3c8">Financial guidance shouldn't be a luxury.</text>
  <text x="82" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5f7286">An AI agent that reviews your money like a personal advisor would.</text>
  <g transform="translate(1080,150)" fill="none" stroke="#2fe6ff">
    <circle r="20" stroke-opacity="0.55" stroke-width="2"/>
    <circle r="45" stroke-opacity="0.30" stroke-width="1.5"/>
    <circle r="72" stroke-opacity="0.15" stroke-width="1.5"/>
  </g>
  <circle cx="1080" cy="150" r="7" fill="#2fe6ff"/>
</svg>
